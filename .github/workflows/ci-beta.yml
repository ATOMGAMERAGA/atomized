name: CI & Beta Release

# Every push to main: run the full pipeline, then publish an automatic prerelease.
on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  pipeline:
    uses: ./.github/workflows/ci.yml

  beta-release:
    needs: pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Dotted suffix (not '+...') because the build already appends '+mc<version>';
      # a second '+' would be invalid SemVer build metadata.
      - name: Clean package (all targets) with beta suffix
        run: ./gradlew clean chiseledBuild -Pversion_suffix="-beta.${{ github.run_number }}.${GITHUB_SHA::7}"

      - name: Collect jars
        run: |
          mkdir -p dist
          find . -path '*/build/libs/atomized-*.jar' ! -name '*-sources.jar' ! -name '*-dev*.jar' -exec cp {} dist/ \;
          ls -la dist/

      - name: Create BETA release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="beta-${{ github.run_number }}"
          gh release create "$TAG" dist/*.jar \
            --prerelease \
            --title "Atomized Beta #${{ github.run_number }} (${GITHUB_SHA::7})" \
            --generate-notes
